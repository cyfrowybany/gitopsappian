apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: appian-nonprod
  namespace: openshift-gitops

spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - list:
        elements:
          # Konfiguracja globalna
          - name: appian-default-conf-tst
            env-dir: default_conf/tst
            namespace: appian-tst
            autoSync: "true"
            autoPrune: "true"
            allowEmpty: "true"

          # Instancja Appian — ręczna synchronizacja
          - name: appian-tst-custom-instance
            env-dir: tst/custom
            namespace: appian-tst
            autoSync: "false"
            autoPrune: "false"
            allowEmpty: "false"

          # Appian CR — lifecycle sterowany przez GitOps
          - name: appian-tst-lifecycle
            env-dir: tst
            namespace: appian-tst
            autoSync: "true"
            autoPrune: "true"
            allowEmpty: "true"

  template:
    metadata:
      name: '{{ .name }}'
      labels:
        appian-environment: tst

    spec:
      project: default

      source:
        repoURL: https://gitlab.example.com/platform/appian-gitops.git
        targetRevision: main
        path: 'environments/{{ .env-dir }}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'

      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=false
          - PrunePropagationPolicy=background

  templatePatch: |
    {{ if eq .autoSync "true" }}
    spec:
      syncPolicy:
        automated:
          enabled: true
          prune: {{ .autoPrune }}
          selfHeal: false
          allowEmpty: {{ .allowEmpty }}
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=false
          - PrunePropagationPolicy=background
    {{ end }}
